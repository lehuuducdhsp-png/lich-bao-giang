<body>
<div class="box"><div class="spin"></div><b>Đang mở chế độ kiểm thử phân quyền nhóm…</b><div id="msg"></div></div>
<script>
(async()=>{
  try{
    const response=await fetch('./index.html?v=20260804.3',{cache:'no-store'});
    if(!response.ok)throw new Error('Không đọc được trang chính: HTTP '+response.status);
    let html=await response.text();
    html=html.replace(/<meta\s+http-equiv=["']Content-Security-Policy["'][^>]*>/i,'');
    html=html.replace(/teacher-fix\.js\?v=[^"']+/g,'teacher-fix.js?v=20260803.10');
    html=html.replace('<title>Lập Lịch Báo giảng</title>','<title>Kiểm thử phân quyền nhóm — Lịch Báo giảng</title><meta name="robots" content="noindex,nofollow">');
    html=html.replace('</body>','<script src="groups-test-loader-v1.js?v=20260804.3"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(error){
    document.getElementById('msg').textContent='Không mở được chế độ kiểm thử: '+(error?.message||String(error));
  }
})();
</script>
</body>
