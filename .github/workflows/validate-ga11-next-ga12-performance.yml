name: Validate GA11 week 23 next GA12 and performance

on:
  pull_request:
    paths:
      - 'ga-kns-november-2026-safe-v1.js'
      - 'ga-progress-dashboard-v1.js'
      - 'teacher-intelligence-v6.js'
      - 'report-engine-v4.js'
      - 'tests/ga11-23t11-next-ga12-performance.test.cjs'
      - '.github/workflows/validate-ga11-next-ga12-performance.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and regression
        run: |
          node --check ga-kns-november-2026-safe-v1.js
          node --check ga-progress-dashboard-v1.js
          node --check teacher-intelligence-v6.js
          node --check report-engine-v4.js
          node tests/ga11-23t11-next-ga12-performance.test.cjs
