name: Wire auth sync feature

on:
  push:
    branches: [feature-auth-sync-v1-20260803]
    paths:
      - '.github/workflows/load-auth-sync-feature.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-loaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-auth-sync-v1-20260803
      - name: Add auth and sync loaders
        run: |
          python - <<'PY'
          from pathlib import Path

          analysis = Path('analysis-fix.js')
          text = analysis.read_text(encoding='utf-8')
          anchor = "    document.body.appendChild(statsV7);\n"
          addition = anchor + "\n    const supabaseConfig=document.createElement('script');\n    supabaseConfig.src='supabase-config.js?v=20260803.1';\n    supabaseConfig.async=false;\n    supabaseConfig.onload=()=>{\n      const authCore=document.createElement('script');\n      authCore.src='auth-core-v1.js?v=20260803.1';\n      authCore.async=false;\n      authCore.onload=()=>{\n        const cloudSync=document.createElement('script');\n        cloudSync.src='cloud-sync-v1.js?v=20260803.1';\n        cloudSync.async=false;\n        document.body.appendChild(cloudSync);\n        const ownerAdmin=document.createElement('script');\n        ownerAdmin.src='owner-admin-v1.js?v=20260803.1';\n        ownerAdmin.async=false;\n        document.body.appendChild(ownerAdmin);\n      };\n      document.body.appendChild(authCore);\n    };\n    document.body.appendChild(supabaseConfig);\n"
          if 'auth-core-v1.js' not in text:
              if anchor not in text:
                  raise SystemExit('Không tìm thấy vị trí chèn bộ đăng nhập.')
              analysis.write_text(text.replace(anchor, addition, 1), encoding='utf-8')

          teacher = Path('teacher-fix.js')
          t = teacher.read_text(encoding='utf-8')
          if 'analysis-fix.js?v=20260803.4' in t:
              teacher.write_text(t.replace('analysis-fix.js?v=20260803.4','analysis-fix.js?v=20260803.5',1), encoding='utf-8')
          elif 'analysis-fix.js?v=20260803.5' not in t:
              raise SystemExit('Không tìm thấy khóa cache analysis-fix.')
          PY
      - name: Commit loader wiring
        run: |
          if git diff --quiet; then
            echo "Auth sync loaders already wired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-fix.js teacher-fix.js
          git commit -m "feat: load auth and TKB sync modules on feature branch"
          git push origin HEAD:feature-auth-sync-v1-20260803
