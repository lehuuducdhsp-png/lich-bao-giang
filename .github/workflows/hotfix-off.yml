name: Hotfix OFF status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-off.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exclude OFF from teacher codes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('teacher-fix.js')
          text = path.read_text(encoding='utf-8')
          old = "const blockedCodes=new Set(['SÁNG','CHIỀU','THỨ','TIẾT','TỔNG','TÊN GV','TÊN GIÁO VIÊN']);"
          new = "const blockedCodes=new Set(['SÁNG','CHIỀU','THỨ','TIẾT','TỔNG','TÊN GV','TÊN GIÁO VIÊN','OFF']);"
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif "'OFF'" not in text.split('\n', 5)[2]:
              raise SystemExit('Không tìm thấy dòng blockedCodes để vá an toàn.')
          PY
      - name: Commit hotfix
        run: |
          if git diff --quiet; then
            echo "OFF đã được loại trước đó."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teacher-fix.js
          git commit -m "fix: treat OFF as no-class status"
          git push
