name: Enable CTV teacher support

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ctv-support-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-ctv-support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow CTV codes and rows
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('teacher-fix.js')
          text = path.read_text(encoding='utf-8')
          old_regex = "if(!/^[A-ZÀ-ỸĐ0-9.]+$/.test(code))continue;"
          new_regex = "if(!/^[A-ZÀ-ỸĐ0-9. ]+$/.test(code))continue;"
          old_skip = "      if(/^CTV\\b/i.test(raw)||/\\bCTV$/i.test(raw))continue;\n"
          changed = False
          if old_regex in text:
              text = text.replace(old_regex, new_regex, 1)
              changed = True
          if old_skip in text:
              text = text.replace(old_skip, '', 1)
              changed = True
          if not changed and (new_regex not in text or old_skip in text):
              raise SystemExit('Không tìm thấy đúng đoạn mã CTV cần vá an toàn.')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit CTV support
        run: |
          if git diff --quiet; then
            echo "Hỗ trợ CTV đã có sẵn."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teacher-fix.js
          git commit -m "fix: include CTV teachers in selection and analysis"
          git push
