name: Validate static modules

on:
  push:
    branches: [main]
    paths:
      - 'access-control-v1.js'
      - 'self-access-guarantee-v1.js'
      - 'teacher-select-refresh-v1.js'
      - 'teacher-code-linking-v2.js'
      - 'global-specialist-v1.js'
      - 'manager-permissions-v1.js'
      - 'manager-cloud-bridge-v1.js'
      - 'group-management-v1.js'
      - 'cloud-sync-v1.js'
      - 'branding-settings-v1.js'
      - 'branding-runtime-v2.js'
      - 'branding-header-fix-v1.js'
      - 'ui-redesign-v1.js'
      - 'report-engine-v3.js'
      - 'mobile-polish-v2.js'
      - 'groups-test-loader-v1.js'
      - 'group-auth-test.html'
      - 'supabase/migrations/20260804_groups_permissions.sql'
      - 'supabase/migrations/20260805_branding_settings.sql'
      - 'supabase/migrations/20260806_teacher_code_linking.sql'
      - 'supabase/migrations/20260806_global_head_specialist.sql'
      - 'supabase/migrations/20260808_manager_permissions.sql'
      - '.github/workflows/validate-static.yml'
  pull_request:
    paths:
      - 'access-control-v1.js'
      - 'self-access-guarantee-v1.js'
      - 'teacher-select-refresh-v1.js'
      - 'teacher-code-linking-v2.js'
      - 'global-specialist-v1.js'
      - 'manager-permissions-v1.js'
      - 'manager-cloud-bridge-v1.js'
      - 'group-management-v1.js'
      - 'cloud-sync-v1.js'
      - 'branding-settings-v1.js'
      - 'branding-runtime-v2.js'
      - 'branding-header-fix-v1.js'
      - 'ui-redesign-v1.js'
      - 'report-engine-v3.js'
      - 'mobile-polish-v2.js'
      - 'groups-test-loader-v1.js'
      - 'group-auth-test.html'
      - 'supabase/migrations/20260804_groups_permissions.sql'
      - 'supabase/migrations/20260805_branding_settings.sql'
      - 'supabase/migrations/20260806_teacher_code_linking.sql'
      - 'supabase/migrations/20260806_global_head_specialist.sql'
      - 'supabase/migrations/20260808_manager_permissions.sql'

permissions:
  contents: read

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check access-control-v1.js
          node --check self-access-guarantee-v1.js
          node --check teacher-select-refresh-v1.js
          node --check teacher-code-linking-v2.js
          node --check global-specialist-v1.js
          node --check manager-permissions-v1.js
          node --check manager-cloud-bridge-v1.js
          node --check group-management-v1.js
          node --check cloud-sync-v1.js
          node --check branding-settings-v1.js
          node --check branding-runtime-v2.js
          node --check branding-header-fix-v1.js
          node --check ui-redesign-v1.js
          node --check report-engine-v3.js
          node --check mobile-polish-v2.js
          node --check groups-test-loader-v1.js
      - name: Check active test loaders
        run: |
          grep -Fq 'groups-test-loader-v1.js' group-auth-test.html
          grep -Fq 'self-access-guarantee-v1.js' groups-test-loader-v1.js
          grep -Fq 'teacher-select-refresh-v1.js' groups-test-loader-v1.js
          grep -Fq 'teacher-code-linking-v2.js' groups-test-loader-v1.js
          grep -Fq 'global-specialist-v1.js' groups-test-loader-v1.js
          grep -Fq 'manager-permissions-v1.js' groups-test-loader-v1.js
          grep -Fq 'manager-cloud-bridge-v1.js' groups-test-loader-v1.js
          grep -Fq 'branding-settings-v1.js' groups-test-loader-v1.js
          grep -Fq 'branding-runtime-v2.js' groups-test-loader-v1.js
          grep -Fq 'ui-redesign-v1.js' groups-test-loader-v1.js
          grep -Fq 'report-engine-v3.js' groups-test-loader-v1.js
          grep -Fq 'mobile-polish-v2.js' groups-test-loader-v1.js
          ! grep -Fq 'report-engine-v2.js' groups-test-loader-v1.js
          ! grep -Fq 'sunday-dynamic-v1.js' groups-test-loader-v1.js
          ! grep -Fq 'group-roster-tkb-v1.js' groups-test-loader-v1.js
          ! grep -Fq 'access-scope-audit-v1.js' groups-test-loader-v1.js
          ! grep -Fq 'combined-role-label-fix-v1.js' groups-test-loader-v1.js
      - name: Check manager permission contracts
        run: |
          grep -Fq 'set_manager_permissions' manager-permissions-v1.js
          grep -Fq 'view_payroll_amounts' manager-permissions-v1.js
          grep -Fq 'set_active_shared_tkb' manager-cloud-bridge-v1.js
          grep -Fq 'can_activate_shared_tkb' cloud-sync-v1.js
          grep -Fq 'manager_can_weekly_stats' supabase/migrations/20260808_manager_permissions.sql
          grep -Fq 'set_global_specialist_access' supabase/migrations/20260808_manager_permissions.sql
          grep -Fq 'set_active_shared_tkb' supabase/migrations/20260808_manager_permissions.sql
      - name: Check report engine contracts
        run: |
          grep -Fq 'weekHasSunday' report-engine-v3.js
          grep -Fq 'GA_PREFIX' report-engine-v3.js
          grep -Fq 'multiExportMode' report-engine-v3.js
          grep -Fq 'weeklyOffDay' report-engine-v3.js
          grep -Fq 'lbgMobileDock' mobile-polish-v2.js
          grep -Fq 'lbg-auth-gate' mobile-polish-v2.js
      - name: Check migration transactions
        run: |
          grep -Eq '^begin;' supabase/migrations/20260804_groups_permissions.sql
          grep -Eq '^commit;' supabase/migrations/20260804_groups_permissions.sql
          grep -Eq '^begin;' supabase/migrations/20260805_branding_settings.sql
          grep -Eq '^commit;' supabase/migrations/20260805_branding_settings.sql
          grep -Eq '^begin;' supabase/migrations/20260806_teacher_code_linking.sql
          grep -Eq '^commit;' supabase/migrations/20260806_teacher_code_linking.sql
          grep -Eq '^begin;' supabase/migrations/20260808_manager_permissions.sql
          grep -Eq '^commit;' supabase/migrations/20260808_manager_permissions.sql
