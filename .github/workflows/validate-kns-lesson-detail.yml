name: Validate KNS lesson detail

on:
  pull_request:
    paths:
      - 'kns-lesson-detail-v2.js'
      - 'app-runtime-v1.js'
      - 'index.html'
      - 'tests/kns-lesson-detail-v2.test.cjs'
      - '.github/workflows/validate-kns-lesson-detail.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check kns-lesson-detail-v2.js
          node --check app-runtime-v1.js
          node --check tests/kns-lesson-detail-v2.test.cjs
      - name: Check runtime contract
        run: |
          grep -Fq "kns-lesson-detail-v2.js?v=20260908.1" app-runtime-v1.js
          grep -Fq "app-runtime-v1.js?v=20260908.1" index.html
          ! grep -Fq "kns-lesson-detail-v1.js?v=" app-runtime-v1.js
      - name: Run KNS lesson mapping tests
        run: node tests/kns-lesson-detail-v2.test.cjs
