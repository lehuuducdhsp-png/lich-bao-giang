name: Patch cloud sync name collision

on:
  push:
    branches: [feature-auth-sync-v1-20260803]
    paths:
      - '.github/workflows/patch-cloud-sync-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-auth-sync-v1-20260803
      - name: Patch cloud sync
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloud-sync-v1.js')
          s=p.read_text(encoding='utf-8')
          replacements={
            "data-personal]').forEach(b=>b.onclick=()=>activate(b.dataset.personal,'personal'))":"data-personal]').forEach(b=>b.onclick=()=>activateCloud(b.dataset.personal,'personal'))",
            "data-shared]').forEach(b=>b.onclick=()=>activate(b.dataset.shared,'shared'))":"data-shared]').forEach(b=>b.onclick=()=>activateCloud(b.dataset.shared,'shared'))",
            "await activate(localId,false);":"if(typeof window.activate==='function')await window.activate(localId,false);",
            "async function activate(id,type)":"async function activateCloud(id,type)"
          }
          changed=False
          for old,new in replacements.items():
            if old in s:
              s=s.replace(old,new)
              changed=True
          if not changed:
            raise SystemExit('Không tìm thấy đoạn cần sửa.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-sync-v1.js
          git commit -m "fix: open cloud TKB without shadowing local activate"
          git push origin HEAD:feature-auth-sync-v1-20260803
