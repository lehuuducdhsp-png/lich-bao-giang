name: Add explicit Data API grants

on:
  push:
    branches: [feature-auth-sync-v1-20260803]
    paths:
      - '.github/workflows/add-explicit-data-api-grants.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-grants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-auth-sync-v1-20260803
      - name: Add least-privilege grants
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/migrations/20260803_auth_sync.sql')
          s=p.read_text(encoding='utf-8')
          anchor="grant execute on function public.reserve_tkb_upload(text,text,bigint,text,text) to authenticated;"
          addition="""grant usage on schema public to authenticated;
grant select on table public.profiles to authenticated;
grant select, delete on table public.tkb_files to authenticated;
grant select, insert, update, delete on table public.user_preferences to authenticated;

"""+anchor
          if 'grant select on table public.profiles to authenticated;' not in s:
              if anchor not in s:
                  raise SystemExit('Không tìm thấy vị trí thêm quyền Data API.')
              p.write_text(s.replace(anchor,addition,1),encoding='utf-8')
          PY
      - name: Commit grants
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260803_auth_sync.sql
          git commit -m "security: use explicit least-privilege Data API grants"
          git push origin HEAD:feature-auth-sync-v1-20260803
