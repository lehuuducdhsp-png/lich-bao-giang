name: Validate assist P Sheets label

on:
  pull_request:
    paths:
      - 'assist-p-sheets-label-safe-v1.js'
      - 'tests/assist-p-sheets-label-safe-v1.test.cjs'
      - 'index.html'
      - '.github/workflows/validate-assist-p-sheets-label-safe.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assist-p-sheets-label-safe-v1.js
      - run: node --test tests/assist-p-sheets-label-safe-v1.test.cjs
