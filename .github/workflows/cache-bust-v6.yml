name: Cache bust v6 modules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-bust-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-loader-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update analysis loader cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('teacher-fix.js')
          text = path.read_text(encoding='utf-8')
          old = "analysis-fix.js?v=20260718.4"
          new = "analysis-fix.js?v=20260803.2"
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Không tìm thấy đường dẫn analysis-fix cần cập nhật.')
          PY
      - name: Commit cache-bust update
        run: |
          if git diff --quiet; then
            echo "Phiên bản cache đã được cập nhật trước đó."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teacher-fix.js
          git commit -m "chore: load v6 modules with fresh cache key"
          git push
