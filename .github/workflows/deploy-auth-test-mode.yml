name: Deploy isolated authentication test mode

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-auth-test-mode.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Copy reviewed authentication modules
        run: |
          git fetch origin feature-auth-sync-v1-20260803
          for file in supabase-config.js auth-core-v1.js cloud-sync-v1.js owner-admin-v1.js sheets-sync-owner-v2.js; do
            git show origin/feature-auth-sync-v1-20260803:"$file" > "$file"
          done
      - name: Install isolated loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('analysis-fix.js')
          s=p.read_text(encoding='utf-8')
          marker='\n(function(){\n  function loadDependentScripts(){'
          pos=s.rfind(marker)
          if pos<0:
              raise SystemExit('Không tìm thấy bộ nạp cuối analysis-fix.js')
          loader=r'''
(function(){
  function appendScript(src,onload){
    const script=document.createElement('script');
    script.src=src;
    script.async=false;
    if(onload)script.onload=onload;
    document.body.appendChild(script);
    return script;
  }

  function loadCommonModules(){
    appendScript('ga-editor.js?v=20260801.1');
    appendScript('multi-teacher-v5.js?v=20260803.1');
    appendScript('conflict-check-v5.js?v=20260803.1');
    appendScript('teacher-intelligence-v6.js?v=20260803.1');
    appendScript('weekly-stats-enhancement-v7.js?v=20260803.2');
  }

  function loadDependentScripts(){
    const startMode=()=>{
      if(window.LBG_SUPABASE_CONFIG?.enabled){
        appendScript('auth-core-v1.js?v=20260803.4',()=>{
          appendScript('cloud-sync-v1.js?v=20260803.4');
          appendScript('owner-admin-v1.js?v=20260803.3');
          appendScript('sheets-sync-owner-v2.js?v=20260803.2');
        });
        loadCommonModules();
      }else{
        appendScript('sheets-sync.js?v=20260801.8');
        loadCommonModules();
      }
    };

    const supabaseConfig=document.createElement('script');
    supabaseConfig.src='supabase-config.js?v=20260803.4';
    supabaseConfig.async=false;
    supabaseConfig.onload=startMode;
    supabaseConfig.onerror=()=>{
      appendScript('sheets-sync.js?v=20260801.8');
      loadCommonModules();
    };
    document.body.appendChild(supabaseConfig);
  }

  const config=document.createElement('script');
  config.src='school-year-config.js?v=20260801.1';
  config.async=false;
  config.onload=loadDependentScripts;
  config.onerror=loadDependentScripts;
  document.body.appendChild(config);
})();
'''
          p.write_text(s[:pos]+loader,encoding='utf-8')

          t=Path('teacher-fix.js')
          ts=t.read_text(encoding='utf-8')
          import re
          updated,n=re.subn(r"analysis-fix\.js\?v=[0-9.]+","analysis-fix.js?v=20260803.6",ts,count=1)
          if n!=1:
              raise SystemExit('Không tìm thấy liên kết analysis-fix.js trong teacher-fix.js')
          t.write_text(updated,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          for file in analysis-fix.js teacher-fix.js supabase-config.js auth-core-v1.js cloud-sync-v1.js owner-admin-v1.js sheets-sync-owner-v2.js; do
            node --check "$file"
          done
      - name: Commit deployment and remove temporary workflow
        run: |
          rm -f .github/workflows/deploy-auth-test-mode.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-fix.js teacher-fix.js supabase-config.js auth-core-v1.js cloud-sync-v1.js owner-admin-v1.js sheets-sync-owner-v2.js .github/workflows/deploy-auth-test-mode.yml
          git commit -m "test: add isolated Supabase authentication mode"
          git push origin HEAD:main
