name: Validate Ha The Hanh 3-4 GA11 23T11

on:
  pull_request:
    paths:
      - 'report-engine-v4.js'
      - 'app-runtime-v1.js'
      - 'index.html'
      - 'tests/ha-the-hanh-3-4-ga11-23t11.test.cjs'
      - '.github/workflows/validate-ha-the-hanh-ga11-23t11.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and source guard
        run: |
          node --check report-engine-v4.js
          node --check app-runtime-v1.js
          node --check tests/ha-the-hanh-3-4-ga11-23t11.test.cjs
          grep -Fq 'report-engine-v4.js?v=20261122.4' app-runtime-v1.js
      - name: Verify exact GA11 correction without touching other classes
        run: node tests/ha-the-hanh-3-4-ga11-23t11.test.cjs
