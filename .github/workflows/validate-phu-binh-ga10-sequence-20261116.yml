name: Validate audited Phu Binh GA9 before GA10

on:
  pull_request:
    paths:
      - 'ga-kns-november-2026-safe-v1.js'
      - 'ga-suggestion-v7.js'
      - 'ga-progress-dashboard-v1.js'
      - 'app-runtime-v1.js'
      - 'patch-runtime-loader-v1.js'
      - 'tests/phu-binh-ga09-before-ga10-16t11.test.cjs'
      - '.github/workflows/validate-phu-binh-ga10-sequence-20261116.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate GA module syntax
        run: |
          node --check ga-kns-november-2026-safe-v1.js
          node --check ga-suggestion-v7.js
          node --check ga-progress-dashboard-v1.js
      - name: Verify three classes and manual GA safety
        run: |
          node tests/phu-binh-ga09-before-ga10-16t11.test.cjs
          node tests/ga-kns-november-production.test.cjs
          node tests/ga-suggestion-v7.test.cjs
          node tests/ga-progress-dashboard-v1.test.cjs
      - name: Verify all 64 source regressions
        run: |
          set -eu
          for test in tests/*.cjs; do node "$test" > /tmp/test.log || { cat /tmp/test.log; exit 1; }; done
      - name: Verify source budget and runtime version
        run: |
          node tests/runtime-stability-budget-v1.test.cjs
          node tests/runtime-responsive-loader-v1.test.cjs
