name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Phu Tan and Thanh Lam release
        run: |
          node --check tkb-parser-v2.js
          node --check app-runtime-v1.js
          node --check tkb-phu-tan-extra-period-v1.js
          node --check assist-p-preview-safe-v1.js
          node --check school-report-v1.js
          node --check patch-runtime-loader-v1.js
          node tests/release-integrity-phu-tan-20261017.test.cjs
          node tests/thanh-lam-release-20261018.test.cjs
          node --check tkb-parser-school-name-fix-v1.js
          node --check tkb-roster-group-period-safe-v1.js
          node tests/tkb-location-boundary-safe-v1.test.cjs
          node tests/tkb-roster-group-period-safe-v1.test.cjs
          node tests/grouped-plus-report-safe-v1.test.cjs
          node tests/runtime-responsive-loader-v1.test.cjs
          node tests/production-runtime-performance.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
