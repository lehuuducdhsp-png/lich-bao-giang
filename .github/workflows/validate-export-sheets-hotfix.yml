name: Validate export and Sheets hotfix

on:
  pull_request:
    paths:
      - 'report-export-hotfix-v2.js'
      - 'sheets-modern-sync-v1.js'
      - 'production-mode-v1.js'
      - 'tests/report-export-hotfix-v2.test.cjs'
      - 'tests/sheets-modern-sync-v1.test.cjs'
      - '.github/workflows/validate-export-sheets-hotfix.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check report-export-hotfix-v2.js
          node --check sheets-modern-sync-v1.js
          node --check production-mode-v1.js
          node --check tests/report-export-hotfix-v2.test.cjs
          node --check tests/sheets-modern-sync-v1.test.cjs
      - name: Unit checks
        run: |
          node tests/report-export-hotfix-v2.test.cjs
          node tests/sheets-modern-sync-v1.test.cjs
      - name: Runtime loader contract
        run: |
          grep -F "report-export-hotfix-v2.js?v=20260909.2" production-mode-v1.js
          grep -F "sheets-modern-sync-v1.js?v=20260909.1" production-mode-v1.js
