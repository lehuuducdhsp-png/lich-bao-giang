name: Validate export and Sheets hotfix

on:
  pull_request:
    paths:
      - 'report-logo-data-v1.js'
      - 'report-export-hotfix-v2.js'
      - 'report-atomic-display-v1.js'
      - 'sheets-sync-owner-v3.js'
      - 'sheets-sync-security-v1.js'
      - 'production-mode-v1.js'
      - 'app-runtime-v1.js'
      - 'index.html'
      - 'tests/report-export-hotfix-v2.test.cjs'
      - 'tests/report-atomic-display-v1.test.cjs'
      - 'tests/sheets-owner-v3.test.cjs'
      - 'recovery/google-sheets/REPORT_BRANDING_20260909.md'
      - '.github/workflows/validate-export-sheets-hotfix.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check report-logo-data-v1.js
          node --check report-export-hotfix-v2.js
          node --check report-atomic-display-v1.js
          node --check sheets-sync-owner-v3.js
          node --check sheets-sync-security-v1.js
          node --check production-mode-v1.js
          node --check app-runtime-v1.js
          node --check tests/report-export-hotfix-v2.test.cjs
          node --check tests/report-atomic-display-v1.test.cjs
          node --check tests/sheets-owner-v3.test.cjs
      - name: Unit checks
        run: |
          node tests/report-export-hotfix-v2.test.cjs
          node tests/report-atomic-display-v1.test.cjs
          node tests/sheets-owner-v3.test.cjs
      - name: Runtime loader contract
        run: |
          grep -F "report-logo-data-v1.js?v=20260909.1" production-mode-v1.js
          grep -F "report-export-hotfix-v2.js?v=20260909.8" production-mode-v1.js
          grep -F "report-atomic-display-v1.js?v=20260909.3" production-mode-v1.js
          grep -F "white-space:normal!important" report-atomic-display-v1.js
          grep -F "overflow-wrap:break-word" report-atomic-display-v1.js
          ! grep -F "new MutationObserver" report-atomic-display-v1.js
          grep -F "sheets-sync-owner-v3.js?v=20260909.2" sheets-sync-security-v1.js
          grep -F "sheets-sync-security-v1.js?v=20260909.2" app-runtime-v1.js
          grep -F "production-mode-v1.js?v=20260909.3" app-runtime-v1.js
          grep -F "app-runtime-v1.js?v=20260909.3" index.html
          grep -F "functions/v1/google-sheets-owner" sheets-sync-owner-v3.js
          ! grep -F "sheets-atomic-payload-v2.js" production-mode-v1.js
          ! grep -F "sheets-modern-sync-v1.js" production-mode-v1.js
          ! grep -F "assets/hoan-nang-report-logo.jpg" report-export-hotfix-v2.js
      - name: Google Sheets branding recovery contract
        run: |
          grep -F 'A1:B3' recovery/google-sheets/REPORT_BRANDING_20260909.md
          grep -F 'C1:H3' recovery/google-sheets/REPORT_BRANDING_20260909.md
          grep -F 'A20:D20' recovery/google-sheets/REPORT_BRANDING_20260909.md
          grep -F 'C9:H13 + C15:H19' recovery/google-sheets/REPORT_BRANDING_20260909.md
          grep -F 'A17' recovery/google-sheets/REPORT_BRANDING_20260909.md
          grep -F 'A20' recovery/google-sheets/REPORT_BRANDING_20260909.md
