name: Validate temp password policy

on:
  pull_request:
    paths:
      - 'temp-password-policy-v1.js'
      - 'production-mode-v1.js'
      - 'supabase/functions/admin-users/index.ts'
      - 'tests/temp-password-policy-v1.test.cjs'
      - 'tests/admin-users-temp-password-policy.test.cjs'
      - '.github/workflows/validate-temp-password-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check temp-password-policy-v1.js
          node --check production-mode-v1.js
          node --check tests/temp-password-policy-v1.test.cjs
          node --check tests/admin-users-temp-password-policy.test.cjs
      - name: Run temp password regressions
        run: |
          node tests/temp-password-policy-v1.test.cjs
          node tests/admin-users-temp-password-policy.test.cjs
