name: Fix monthly tally module

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-monthly-module.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove old monthly module and update version label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace(' <script src="monthly-tally.js?v=20260801.1"></script>\n', '')
          text = text.replace('<script src="monthly-tally.js?v=20260801.1"></script>', '')
          text = text.replace('Phiên bản độc lập 2026.07.18.1', 'Phiên bản độc lập 2026.08.01.2')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit corrected page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change needed"
          else
            git commit -m "fix: remove obsolete monthly tally module"
            git push
          fi