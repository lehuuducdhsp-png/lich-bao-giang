name: Switch auth test to owner admin v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/switch-owner-admin-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Switch loader and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('analysis-fix.js')
          s=p.read_text(encoding='utf-8')
          old="appendScript('owner-admin-v1.js?v=20260803.3');"
          new="appendScript('owner-admin-v2.js?v=20260803.1');"
          if old not in s:
              raise SystemExit('Không tìm thấy owner-admin-v1 trong bộ nạp.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check owner-admin-v2.js
          node --check analysis-fix.js
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/switch-owner-admin-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-fix.js .github/workflows/switch-owner-admin-v2.yml
          git commit -m "feat: enable bulk teacher account import in auth test"
          git push origin HEAD:main
