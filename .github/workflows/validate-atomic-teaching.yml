name: Validate atomic teaching semantics

on:
  pull_request:
    paths:
      - 'app-runtime-v1.js'
      - 'tkb-parser-bridge-v2.js'
      - 'tkb-atomic-teaching-v1.js'
      - 'checkin-tomorrow-order-v1.js'
      - 'tests/atomic-teaching-v1.test.cjs'
      - '.github/workflows/validate-atomic-teaching.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app-runtime-v1.js
          node --check tkb-parser-bridge-v2.js
          node --check tkb-atomic-teaching-v1.js
          node --check checkin-tomorrow-order-v1.js
          node --check tests/atomic-teaching-v1.test.cjs
      - name: Run atomic teaching regression
        run: node tests/atomic-teaching-v1.test.cjs
      - name: Build local Windows preview
        shell: bash
        run: |
          mkdir -p preview-package
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.json' \) -exec cp '{}' preview-package/ \;
          python3 - <<'PY'
          from pathlib import Path
          p=Path('preview-package/index-core.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Lập Lịch Báo giảng</title>','<title>BẢN THỬ PR #24 – Lập Lịch Báo giảng</title>',1)
          banner='''<div style="position:sticky;top:0;z-index:99999;background:#7f1d1d;color:#fff;padding:9px 14px;text-align:center;font:800 13px system-ui;letter-spacing:.02em;box-shadow:0 2px 8px #0003">BẢN THỬ PR #24 — CHỈ KIỂM TRA • CHƯA PHẢI WEBSITE CHÍNH THỨC</div>'''
          s=s.replace('<body>','<body>'+banner,1)
          p.write_text(s,encoding='utf-8')
          PY
          cat > preview-package/START_TEST_SERVER.ps1 <<'PS1'
          $ErrorActionPreference = 'Stop'
          $root = Split-Path -Parent $MyInvocation.MyCommand.Path
          $port = 8765
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, $port)
          $listener.Start()
          Write-Host ''
          Write-Host '==============================================' -ForegroundColor Cyan
          Write-Host '  BAN THU PR #24 - LICH BAO GIANG' -ForegroundColor Yellow
          Write-Host '  Dang mo: http://127.0.0.1:8765/' -ForegroundColor Green
          Write-Host '  Dong cua so nay de dung ban thu.' -ForegroundColor Cyan
          Write-Host '==============================================' -ForegroundColor Cyan
          Write-Host ''
          Start-Process "http://127.0.0.1:$port/index.html"
          $mime = @{
            '.html'='text/html; charset=utf-8'; '.js'='text/javascript; charset=utf-8'; '.json'='application/json; charset=utf-8';
            '.css'='text/css; charset=utf-8'; '.png'='image/png'; '.jpg'='image/jpeg'; '.jpeg'='image/jpeg'; '.svg'='image/svg+xml'
          }
          try {
            while ($true) {
              $client = $listener.AcceptTcpClient()
              try {
                $stream = $client.GetStream()
                $reader = New-Object System.IO.StreamReader($stream, [Text.Encoding]::ASCII, $false, 4096, $true)
                $first = $reader.ReadLine()
                if (-not $first) { $client.Close(); continue }
                while (($line = $reader.ReadLine()) -ne $null -and $line -ne '') {}
                $parts = $first.Split(' ')
                $target = if ($parts.Length -ge 2) { $parts[1] } else { '/' }
                $target = ($target -split '\?')[0]
                $target = [Uri]::UnescapeDataString($target.TrimStart('/'))
                if ([string]::IsNullOrWhiteSpace($target)) { $target = 'index.html' }
                if ($target.Contains('..')) { throw 'Invalid path' }
                $file = Join-Path $root ($target -replace '/', [IO.Path]::DirectorySeparatorChar)
                if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
                  $body = [Text.Encoding]::UTF8.GetBytes('404 - Khong tim thay tep')
                  $head = "HTTP/1.1 404 Not Found`r`nContent-Type: text/plain; charset=utf-8`r`nContent-Length: $($body.Length)`r`nConnection: close`r`n`r`n"
                } else {
                  $body = [IO.File]::ReadAllBytes($file)
                  $ext = [IO.Path]::GetExtension($file).ToLowerInvariant()
                  $type = if ($mime.ContainsKey($ext)) { $mime[$ext] } else { 'application/octet-stream' }
                  $head = "HTTP/1.1 200 OK`r`nContent-Type: $type`r`nContent-Length: $($body.Length)`r`nCache-Control: no-store`r`nConnection: close`r`n`r`n"
                }
                $hb = [Text.Encoding]::ASCII.GetBytes($head)
                $stream.Write($hb,0,$hb.Length)
                $stream.Write($body,0,$body.Length)
                $stream.Flush()
              } catch {
                Write-Host ('Yeu cau loi: ' + $_.Exception.Message) -ForegroundColor DarkYellow
              } finally {
                $client.Close()
              }
            }
          } finally {
            $listener.Stop()
          }
          PS1
          cat > preview-package/MO_BAN_THU.bat <<'BAT'
          @echo off
          chcp 65001 >nul
          title BẢN THỬ PR #24 - LỊCH BÁO GIẢNG
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0START_TEST_SERVER.ps1"
          pause
          BAT
          cat > preview-package/README_TEST.txt <<'TXT'
          BẢN THỬ PR #24 - LỊCH BÁO GIẢNG
          ==================================
          1. Giải nén toàn bộ thư mục.
          2. Nhấp đúp MO_BAN_THU.bat.
          3. Trình duyệt sẽ tự mở tại http://127.0.0.1:8765/
          4. Đăng nhập như bình thường nếu hệ thống yêu cầu.
          5. Chỉ kiểm tra, KHÔNG bấm xác nhận/lưu/xóa/tải lên dữ liệu quản trị.
          6. Kiểm tra Hoài Thanh: Lịch Báo giảng tổng 15 tiết và thứ tự lịch KHỐI 3 trước Lớp 4/5.
          7. Đóng cửa sổ PowerShell để tắt bản thử.
          TXT
      - name: Upload local preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: lich-bao-giang-pr24-local-preview
          path: preview-package
          if-no-files-found: error
          retention-days: 7
