name: Guard CTV teacher codes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ctv-code-guard-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-ctv-code-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restrict spaced codes to CTV only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('teacher-fix.js')
          text = path.read_text(encoding='utf-8')
          old = "if(!/^[A-ZÀ-ỸĐ0-9. ]+$/.test(code))continue;"
          new = "if(!/^[A-ZÀ-ỸĐ0-9.]+$/.test(code)&&!(/^[A-ZÀ-ỸĐ0-9. ]+$/.test(code)&&/(^| )CTV($| )/.test(code)))continue;"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Không tìm thấy điều kiện mã giáo viên cần vá.')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit safe CTV guard
        run: |
          if git diff --quiet; then
            echo "Điều kiện CTV an toàn đã có sẵn."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teacher-fix.js
          git commit -m "fix: accept spaced CTV codes without matching timetable headers"
          git push
