name: Build isolated TEST ZIP - Phu Binh GA continuity

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tkb-roster-group-period-safe-v1.js'
      - 'ga-per-class-v2.js'
      - 'ga-suggestion-v7.js'
      - 'ga-suggestion-cross-version-v1.js'
      - 'tests/phu-binh-ga-legacy-history-16t11.test.cjs'
      - '.github/workflows/build-test-zip-phu-binh-ga-history-20261113.yml'

permissions:
  contents: read

jobs:
  package:
    if: ${{ github.head_ref == 'test/phu-binh-legacy-ga-continuity-20261113' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout independent TEST (not main)
        uses: actions/checkout@v4
      - name: Verify GA history and protected schedules
        run: |
          node --check tkb-roster-group-period-safe-v1.js
          node --check ga-suggestion-v7.js
          node --check ga-suggestion-cross-version-v1.js
          node --check ga-per-class-v2.js
          node tests/phu-binh-ga-legacy-history-16t11.test.cjs
          node tests/phu-binh-phu-hau-16t11-real-layout.test.cjs
          node tests/phu-binh-cs2-26t10-ga8.test.cjs
          node tests/ga-per-class-v2.test.cjs
          node tests/ga-kns-november-production.test.cjs
          node tests/runtime-responsive-loader-v1.test.cjs
      - name: Build TEST-only source ZIP
        run: |
          mkdir -p dist
          git archive --format=zip --output dist/Lich_Bao_Giang_TEST_Lich_Su_GA_Phu_Binh_20261113.zip HEAD
          unzip -t dist/Lich_Bao_Giang_TEST_Lich_Su_GA_Phu_Binh_20261113.zip | tail -1
          echo "TEST SHA: $(git rev-parse HEAD)"
      - name: Publish TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: LBG-TEST-GA-History-Phu-Binh-20261113
          path: dist/Lich_Bao_Giang_TEST_Lich_Su_GA_Phu_Binh_20261113.zip
          retention-days: 30
          if-no-files-found: error
