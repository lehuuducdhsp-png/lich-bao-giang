name: Refresh weekly stats v7.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-weekly-stats-v7-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump module cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          analysis = Path('analysis-fix.js')
          a = analysis.read_text(encoding='utf-8')
          a = a.replace('weekly-stats-enhancement-v7.js?v=20260803.1','weekly-stats-enhancement-v7.js?v=20260803.2')
          analysis.write_text(a, encoding='utf-8')

          teacher = Path('teacher-fix.js')
          t = teacher.read_text(encoding='utf-8')
          t = t.replace('analysis-fix.js?v=20260803.3','analysis-fix.js?v=20260803.4')
          teacher.write_text(t, encoding='utf-8')
          PY
      - name: Commit cache refresh
        run: |
          if git diff --quiet; then
            echo "Cache keys already refreshed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-fix.js teacher-fix.js
          git commit -m "chore: refresh cache for weekly stats v7.2"
          git push
