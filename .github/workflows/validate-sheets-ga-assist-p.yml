name: Validate Sheets GA and assistant P class

on:
  pull_request:
    paths:
      - 'sheets-ga-save-safe-v1.js'
      - 'assist-p-preview-safe-v1.js'
      - 'ga-per-class-v2.js'
      - 'index.html'
      - 'tests/sheets-ga-save-safe-v1.test.cjs'
      - 'tests/assist-p-class-pairing-v1.test.cjs'
      - '.github/workflows/validate-sheets-ga-assist-p.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check sheets-ga-save-safe-v1.js
          node --check assist-p-preview-safe-v1.js
          node --check ga-per-class-v2.js
          node --check tests/sheets-ga-save-safe-v1.test.cjs
          node --check tests/assist-p-class-pairing-v1.test.cjs
      - name: Regression checks
        run: |
          node tests/sheets-ga-save-safe-v1.test.cjs
          node tests/assist-p-class-pairing-v1.test.cjs
      - name: Loader contract
        run: |
          grep -F 'app-runtime-v1.js?v=20260913.1' index.html
          grep -F 'ga-per-class-v2.js?v=20260914.1' index.html
          grep -F 'sheets-ga-save-safe-v1.js?v=20260913.1' index.html
          grep -F 'assist-p-preview-safe-v1.js?v=20260913.5' index.html
      - name: Assist P own-column class contract
        run: |
          grep -F "const VERSION='20260913.5'" assist-p-preview-safe-v1.js
          grep -F "CHÍNH CỘT" assist-p-preview-safe-v1.js
          grep -F "1/1" tests/assist-p-class-pairing-v1.test.cjs
          grep -F "1/3" tests/assist-p-class-pairing-v1.test.cjs
          grep -F "ĐỨCP" tests/assist-p-class-pairing-v1.test.cjs
