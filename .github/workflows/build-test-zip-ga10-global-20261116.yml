name: Build TEST ZIP - global 09T11 GA10 catch-up

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'ga-kns-november-2026-safe-v1.js'
      - 'ga-progress-dashboard-v1.js'
      - 'ga-suggestion-v7.js'
      - 'tests/ga-global-09t11-backfill-all-schools.test.cjs'
      - 'BAO_CAO_RASOAT_GA10_09T11_TOAN_TRUONG_20261116.md'
      - '.github/workflows/build-test-zip-ga10-global-20261116.yml'

permissions:
  contents: read

jobs:
  package-test:
    if: ${{ github.head_ref == 'test/global-ga10-09t11-return-unlearned-20261116' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated TEST revision
        uses: actions/checkout@v4
      - name: Validate all-school GA10 rule and runtime
        run: |
          node --check ga-kns-november-2026-safe-v1.js
          node --check ga-progress-dashboard-v1.js
          node tests/ga-global-09t11-backfill-all-schools.test.cjs
          node tests/ga-kns-november-production.test.cjs
          node tests/ga-progress-dashboard-v1.test.cjs
          node tests/phu-binh-ga-legacy-history-16t11.test.cjs
          node tests/quang-trung-21t9-class-ga.test.cjs
          node tests/runtime-responsive-loader-v1.test.cjs
          node tests/runtime-stability-budget-v1.test.cjs
      - name: Bundle unchanged source and audited changes
        run: |
          mkdir -p dist
          git archive --format=zip --output dist/Lich_Bao_Giang_TEST_GA10_09T11_Toan_Truong_20261116.zip HEAD
          unzip -t dist/Lich_Bao_Giang_TEST_GA10_09T11_Toan_Truong_20261116.zip | tail -1
          echo "TEST sha: $(git rev-parse HEAD)"
      - name: Upload TEST only (no Pages deploy)
        uses: actions/upload-artifact@v4
        with:
          name: LBG-TEST-GA10-09T11-Toan-Truong-20261116
          path: dist/Lich_Bao_Giang_TEST_GA10_09T11_Toan_Truong_20261116.zip
          retention-days: 30
          if-no-files-found: error
