name: Validate assist P summary and monthly

on:
  pull_request:
    paths:
      - 'assist-p-preview-safe-v1.js'
      - 'assist-p-summary-monthly-safe-v1.js'
      - 'assist-p-web-footer-safe-v1.js'
      - 'index.html'
      - 'tests/assist-p-preview-safe-v1.test.cjs'
      - 'tests/assist-p-summary-monthly-safe-v1.test.cjs'
      - 'tests/assist-p-web-footer-safe-v1.test.cjs'
      - '.github/workflows/validate-assist-p-summary-monthly-safe.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check assist-p-preview-safe-v1.js
          node --check assist-p-summary-monthly-safe-v1.js
          node --check assist-p-web-footer-safe-v1.js
          node --check tests/assist-p-preview-safe-v1.test.cjs
          node --check tests/assist-p-summary-monthly-safe-v1.test.cjs
          node --check tests/assist-p-web-footer-safe-v1.test.cjs
      - name: Run assist P tests
        run: |
          node tests/assist-p-preview-safe-v1.test.cjs
          node tests/assist-p-summary-monthly-safe-v1.test.cjs
          node tests/assist-p-web-footer-safe-v1.test.cjs
      - name: Run regression suite
        run: |
          node tests/atomic-teaching-v1.test.cjs
          node tests/report-pay-rules-v1.test.cjs
          node tests/sheets-atomic-payload-v2.test.cjs
          node tests/production-runtime-performance.test.cjs
          node tests/report-atomic-display-v1.test.cjs
          node tests/ga-suggestion-v7.test.cjs
          node tests/kns-lesson-detail-v2.test.cjs
          node tests/report-export-hotfix-v2.test.cjs
      - name: Check test-only loading contract
        run: |
          grep -Fq 'assist-p-preview-safe-v1.js?v=20260911.1' index.html
          grep -Fq 'assist-p-summary-monthly-safe-v1.js?v=20260912.1' index.html
          grep -Fq 'assist-p-web-footer-safe-v1.js?v=20260912.1' index.html
          ! grep -Fq 'assist-p-summary-monthly-safe-v1.js' app-runtime-v1.js
          ! grep -Fq 'assist-p-web-footer-safe-v1.js' app-runtime-v1.js
